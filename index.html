<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр ППС МВШМ</title>
<style>
  :root {
    --bg:#f4f6fa; --card:#fff; --text:#1d2433; --muted:#6b7385;
    --accent:#1f5fbf; --accent-soft:#e6eefb; --ok:#1e8e4e; --ok-soft:#e3f5ea;
    --bad:#c62f2f; --bad-soft:#fbe6e6; --border:#dde2ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#12151c; --card:#1b2029; --text:#e8ebf2; --muted:#9aa3b5;
      --accent:#5b93e8; --accent-soft:#1f2b40; --ok:#4cc27f; --ok-soft:#173225;
      --bad:#ef6b6b; --bad-soft:#3a1c1c; --border:#2c3340;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.45; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  header { text-align:center; margin:8px 0 14px; }
  header h1 { font-size:1.3rem; margin:0 0 4px; }
  header p { margin:0; color:var(--muted); font-size:.88rem; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tab { flex:1; font:inherit; font-size:.9rem; font-weight:600; padding:10px 4px;
    border:1.5px solid var(--border); background:var(--card); color:var(--muted);
    border-radius:10px; cursor:pointer; }
  .tab.active { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .hidden { display:none !important; }
  input[type=search], select { width:100%; font:inherit; padding:10px 12px; border-radius:10px;
    border:1.5px solid var(--border); background:var(--card); color:var(--text); margin-bottom:10px; }
  .topic-h { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--accent);
    margin:16px 0 6px; font-weight:700; }
  details { border-bottom:1px solid var(--border); padding:10px 0; }
  summary { cursor:pointer; font-weight:600; }
  .ans { margin-top:8px; padding:10px 12px; background:var(--ok-soft); border-left:4px solid var(--ok);
    border-radius:8px; font-size:.95rem; }
  .empty { color:var(--muted); text-align:center; padding:20px 0; }
  .progress { height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin:6px 0 14px; }
  .progress > div { height:100%; background:var(--ok); width:0; transition:width .25s; }
  .meta { display:flex; justify-content:space-between; color:var(--muted); font-size:.85rem; }
  .flash-topic { color:var(--accent); font-size:.8rem; font-weight:700; text-transform:uppercase; }
  .flash-q { font-size:1.15rem; font-weight:600; margin:8px 0 16px; min-height:3em; }
  .btn { font:inherit; font-weight:600; border:none; border-radius:10px; padding:12px 16px;
    cursor:pointer; background:var(--accent); color:#fff; width:100%; }
  .btn.ok { background:var(--ok); }
  .btn.again { background:var(--bad-soft); color:var(--bad); }
  .btn.ghost { background:var(--accent-soft); color:var(--accent); margin-top:10px; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .opt { display:block; width:100%; text-align:left; font:inherit; color:var(--text);
    background:var(--card); border:1.5px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:10px; cursor:pointer; }
  .opt:disabled { cursor:default; }
  .opt.correct { border-color:var(--ok); background:var(--ok-soft); }
  .opt.wrong { border-color:var(--bad); background:var(--bad-soft); }
  .explain { font-size:.93rem; margin:6px 0 12px; padding:12px 14px; background:var(--accent-soft);
    border-left:4px solid var(--accent); border-radius:8px; }
  .explain b { display:block; margin-bottom:4px; color:var(--accent); }
  .note { color:var(--muted); font-size:.82rem; text-align:center; margin-top:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Тренажёр ППС МВШМ</h1>
    <p>Подготовка к комиссии</p>
  </header>

  <div class="tabs">
    <button class="tab active" data-v="ref">📖 Справочник</button>
    <button class="tab" data-v="cards">🃏 Карточки</button>
    <button class="tab" data-v="check">✅ Самопроверка</button>
  </div>

  <!-- СПРАВОЧНИК -->
  <div id="v-ref" class="card">
    <input type="search" id="search" placeholder="Поиск по слову…">
    <div id="refList"></div>
  </div>

  <!-- КАРТОЧКИ -->
  <div id="v-cards" class="card hidden">
    <div class="meta"><span id="learnedTxt"></span><span id="leftTxt"></span></div>
    <div class="progress"><div id="learnedBar"></div></div>
    <div id="cardBox">
      <div class="flash-topic" id="fTopic"></div>
      <div class="flash-q" id="fQ"></div>
      <div class="ans hidden" id="fA"></div>
      <button class="btn" id="showBtn">Показать ответ</button>
      <div class="row hidden" id="rateRow">
        <button class="btn again" id="againBtn">Повторить</button>
        <button class="btn ok" id="knowBtn">Знаю ✓</button>
      </div>
    </div>
    <div id="doneBox" class="hidden" style="text-align:center">
      <p style="font-size:1.1rem;font-weight:600">🎉 Все карточки выучены!</p>
    </div>
    <button class="btn ghost" id="resetBtn">Начать заново</button>
  </div>

  <!-- САМОПРОВЕРКА -->
  <div id="v-check" class="card hidden">
    <div class="meta"><span id="cCounter"></span><span id="cRight"></span></div>
    <div class="progress"><div id="cBar" style="background:var(--accent)"></div></div>
    <div class="flash-topic" id="cTopic"></div>
    <div class="flash-q" id="cQ"></div>
    <div id="cOpts"></div>
    <div class="explain hidden" id="cExp"></div>
    <button class="btn hidden" id="cNext">Далее</button>
  </div>

  <p class="note">Демо-версия · вопросы придуманы для примера</p>
</div>

<script src="questions.js"></script>
<script>


const $ = id => document.getElementById(id);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- вкладки ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x===t));
  ["ref","cards","check"].forEach(v => $("v-"+v).classList.toggle("hidden", v!==t.dataset.v));
  if (t.dataset.v==="check") startCheck();
});

/* ---------- справочник ---------- */
function renderRef() {
  const term = $("search").value.trim().toLowerCase();
  const box = $("refList"); box.innerHTML = "";
  let lastTopic = null, found = 0;
  QUESTIONS.forEach(item => {
    if (term && !(item.q+" "+item.a).toLowerCase().includes(term)) return;
    found++;
    if (item.topic !== lastTopic) {
      const h = document.createElement("div"); h.className="topic-h"; h.textContent=item.topic;
      box.appendChild(h); lastTopic = item.topic;
    }
    const d = document.createElement("details");
    if (term) d.open = true;
    d.innerHTML = "<summary></summary><div class='ans'></div>";
    d.children[0].textContent = item.q;
    d.children[1].textContent = item.a;
    box.appendChild(d);
  });
  if (!found) box.innerHTML = "<div class='empty'>Ничего не найдено</div>";
}
$("search").oninput = renderRef;

/* ---------- карточки ---------- */
const KEY = "pps_learned_v1";
let learned = new Set();
try { learned = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...learned])); } catch(e) {} };
let queue = [], cur = null;

function buildQueue() { queue = shuffle(QUESTIONS.map((_,i)=>i).filter(i => !learned.has(i))); }
function showCard() {
  $("learnedTxt").textContent = `Выучено ${learned.size} из ${QUESTIONS.length}`;
  $("learnedBar").style.width = (learned.size/QUESTIONS.length*100)+"%";
  if (!queue.length) buildQueue();
  if (!queue.length) { $("cardBox").classList.add("hidden"); $("doneBox").classList.remove("hidden"); $("leftTxt").textContent=""; return; }
  $("cardBox").classList.remove("hidden"); $("doneBox").classList.add("hidden");
  cur = queue.shift();
  $("leftTxt").textContent = `Осталось ${QUESTIONS.length - learned.size}`;
  $("fTopic").textContent = QUESTIONS[cur].topic;
  $("fQ").textContent = QUESTIONS[cur].q;
  $("fA").textContent = QUESTIONS[cur].a;
  $("fA").classList.add("hidden"); $("rateRow").classList.add("hidden"); $("showBtn").classList.remove("hidden");
}
$("showBtn").onclick = () => { $("fA").classList.remove("hidden"); $("showBtn").classList.add("hidden"); $("rateRow").classList.remove("hidden"); };
$("knowBtn").onclick = () => { learned.add(cur); save(); showCard(); };
$("againBtn").onclick = () => { queue.splice(Math.min(2, queue.length), 0, cur); showCard(); }; // вернётся через 2 карточки
$("resetBtn").onclick = () => { learned.clear(); save(); buildQueue(); showCard(); };

/* ---------- самопроверка ---------- */
let cOrder=[], cIdx=0, cRight=0;
function startCheck() { cOrder = shuffle(QUESTIONS.map((_,i)=>i)); cIdx=0; cRight=0; renderCheck(); }
function renderCheck() {
  if (cIdx >= cOrder.length) {
    $("cTopic").textContent=""; $("cQ").textContent = `Готово! Верно ${cRight} из ${cOrder.length}. Ошибки — повод заглянуть в справочник.`;
    $("cOpts").innerHTML=""; $("cExp").classList.add("hidden");
    $("cNext").textContent="Пройти ещё раз"; $("cNext").classList.remove("hidden"); $("cNext").onclick=startCheck; return;
  }
  const q = QUESTIONS[cOrder[cIdx]];
  $("cCounter").textContent = `Вопрос ${cIdx+1} из ${cOrder.length}`;
  $("cRight").textContent = `Верно: ${cRight}`;
  $("cBar").style.width = (cIdx/cOrder.length*100)+"%";
  $("cTopic").textContent = q.topic; $("cQ").textContent = q.q;
  $("cExp").classList.add("hidden"); $("cNext").classList.add("hidden");
  const box = $("cOpts"); box.innerHTML="";
  shuffle(q.options.map((t,i)=>({t,i}))).forEach(o => {
    const b = document.createElement("button"); b.className="opt"; b.textContent=o.t; b.dataset.i=o.i;
    b.onclick = () => {
      const ok = o.i===q.correct; if (ok) cRight++;
      box.querySelectorAll(".opt").forEach(x => { x.disabled=true;
        if (+x.dataset.i===q.correct) x.classList.add("correct"); else if (x===b) x.classList.add("wrong"); });
      $("cExp").innerHTML = "<b>"+(ok?"✓ Верно. ":"✗ Неверно. ")+"Почему так:</b>";
      $("cExp").appendChild(document.createTextNode(q.explain || q.a));
      $("cExp").classList.remove("hidden"); $("cRight").textContent=`Верно: ${cRight}`;
      $("cNext").textContent="Далее"; $("cNext").onclick=()=>{cIdx++;renderCheck();}; $("cNext").classList.remove("hidden");
    };
    box.appendChild(b);
  });
}

renderRef(); buildQueue(); showCard();
</script>
</body>
</html>
