<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр ППС МВШМ</title>
<style>
  :root {
    --bg: #f4f6fa; --card: #ffffff; --text: #1d2433; --muted: #6b7385;
    --accent: #1f5fbf; --accent-soft: #e6eefb; --ok: #1e8e4e; --ok-soft: #e3f5ea;
    --bad: #c62f2f; --bad-soft: #fbe6e6; --border: #dde2ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b2029; --text: #e8ebf2; --muted: #9aa3b5;
      --accent: #5b93e8; --accent-soft: #1f2b40; --ok: #4cc27f; --ok-soft: #173225;
      --bad: #ef6b6b; --bad-soft: #3a1c1c; --border: #2c3340;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  header { text-align: center; margin: 12px 0 20px; }
  header h1 { font-size: 1.35rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--muted); font-size: .9rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
  }
  .progress { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 14px; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 10px; }
  .question { font-size: 1.08rem; font-weight: 600; margin: 0 0 16px; }
  .opt {
    display: block; width: 100%; text-align: left; font: inherit; color: var(--text);
    background: var(--card); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--ok); background: var(--ok-soft); }
  .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
  .explain {
    font-size: .93rem; margin: 6px 0 14px; padding: 12px 14px;
    background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 8px;
  }
  .explain b { display: block; margin-bottom: 4px; color: var(--accent); }
  .r-exp { color: var(--muted); margin-top: 4px; }
  .btn {
    display: inline-block; font: inherit; font-weight: 600; border: none; border-radius: 10px;
    padding: 12px 18px; cursor: pointer; background: var(--accent); color: #fff; width: 100%;
  }
  .btn.secondary { background: var(--accent-soft); color: var(--accent); margin-top: 10px; }
  .hidden { display: none; }
  .score { font-size: 2.4rem; font-weight: 700; text-align: center; margin: 4px 0; }
  .verdict { text-align: center; color: var(--muted); margin-bottom: 18px; }
  .review-item { border-top: 1px solid var(--border); padding: 12px 0; font-size: .93rem; }
  .review-item b { display: block; margin-bottom: 4px; }
  .r-bad { color: var(--bad); }
  .r-ok { color: var(--ok); }
  label.chk { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: .95rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Тренажёр ППС МВШМ</h1>
    <p>Подготовка к тестированию</p>
  </header>

  <!-- Стартовый экран -->
  <div id="start" class="card">
    <p>Вопросов в базе: <b id="total"></b></p>
    <label class="chk"><input type="checkbox" id="shuffleQ" checked> Перемешать вопросы</label>
    <label class="chk"><input type="checkbox" id="shuffleA" checked> Перемешать варианты ответов</label>
    <br>
    <button class="btn" onclick="startQuiz(false)">Начать тест</button>
    <button class="btn secondary hidden" id="retryBtn" onclick="startQuiz(true)">Повторить только ошибки</button>
  </div>

  <!-- Экран вопроса -->
  <div id="quiz" class="card hidden">
    <div class="progress"><div id="bar"></div></div>
    <div class="meta"><span id="counter"></span><span id="live"></span></div>
    <p class="question" id="qText"></p>
    <div id="options"></div>
    <p class="explain hidden" id="explain"></p>
    <button class="btn hidden" id="nextBtn" onclick="next()">Далее</button>
  </div>

  <!-- Результат -->
  <div id="result" class="card hidden">
    <div class="score" id="score"></div>
    <div class="verdict" id="verdict"></div>
    <button class="btn" onclick="showStart()">На главную</button>
    <button class="btn secondary" id="retryBtn2" onclick="startQuiz(true)">Повторить только ошибки</button>
    <div id="review" style="margin-top:18px"></div>
  </div>
</div>

<script>
/* =========================================================
   ВОПРОСЫ. Здесь заменить тестовые вопросы на настоящие.
   correct — номер правильного варианта, считая с 0.
   explain — пояснение (необязательно).
   ========================================================= */
const QUESTIONS = [
  {
    q: "Какой документ определяет содержание и результаты обучения по дисциплине?",
    options: ["Силлабус", "Приказ ректора", "Расписание занятий", "Журнал успеваемости"],
    correct: 0,
    explain: "Силлабус описывает цели, темы, результаты обучения и критерии оценки."
  },
  {
    q: "Что из перечисленного относится к формативному оцениванию?",
    options: ["Итоговый экзамен", "Обратная связь по ходу занятия", "Государственная аттестация", "Рейтинг за семестр"],
    correct: 1,
    explain: "Формативное оценивание направлено на улучшение обучения в процессе, а не на итоговую оценку."
  },
  {
    q: "Что означает аббревиатура OSCE?",
    options: [
      "Открытый семинар клинического обучения",
      "Объективный структурированный клинический экзамен",
      "Общая система контроля экзаменов",
      "Онлайн-симуляция клинических случаев"
    ],
    correct: 1,
    explain: "OSCE — Objective Structured Clinical Examination, экзамен по станциям."
  },
  {
    q: "Какой уровень таксономии Блума является наивысшим (в пересмотренной версии)?",
    options: ["Понимание", "Применение", "Анализ", "Создание"],
    correct: 3,
    explain: "В пересмотренной таксономии Блума (2001) уровни идут так: запоминание → понимание → применение → анализ → оценка → создание. Создание — высший уровень."
  },
  {
    q: "Метод обучения, при котором студенты разбирают клинический случай в малых группах:",
    options: ["Лекция", "PBL (проблемно-ориентированное обучение)", "Самостоятельная работа", "Тестирование"],
    correct: 1,
    explain: "PBL (Problem-Based Learning) — студенты в малых группах сами разбирают клинический случай, а преподаватель выступает как тьютор."
  },
  {
    q: "Какая нормальная частота сердечных сокращений у взрослого в покое?",
    options: ["40–50 уд/мин", "60–90 уд/мин", "100–120 уд/мин", "120–140 уд/мин"],
    correct: 1,
    explain: "Норма ЧСС у взрослого в покое — 60–90 уд/мин. Ниже 60 — брадикардия, выше 90 — тахикардия."
  },
  {
    q: "Что является основным принципом академической честности?",
    options: [
      "Использование чужих работ без ссылок",
      "Самостоятельность и корректное цитирование источников",
      "Помощь студентам на экзамене",
      "Списывание при согласии преподавателя"
    ],
    correct: 1,
    explain: "Академическая честность — это самостоятельное выполнение работ и обязательные ссылки на чужие идеи и тексты."
  },
  {
    q: "Сколько кредитов ECTS обычно соответствует одному академическому году?",
    options: ["30", "45", "60", "90"],
    correct: 2,
    explain: "Стандартная нагрузка — 60 кредитов ECTS в год (30 в семестр)."
  },
  {
    q: "Что такое «результат обучения» (learning outcome)?",
    options: [
      "Количество часов по дисциплине",
      "Оценка в зачётной книжке",
      "То, что студент должен знать и уметь после обучения",
      "Список литературы"
    ],
    correct: 2,
    explain: "Результат обучения — измеримое описание того, что студент будет знать, уметь и демонстрировать после курса."
  },
  {
    q: "Какой инструмент чаще всего используют для оценки практических навыков у постели больного?",
    options: ["Mini-CEX", "Эссе", "Устный опрос по билетам", "Реферат"],
    correct: 0,
    explain: "Mini-CEX — мини-клиническое оценочное упражнение с наблюдением реального приёма пациента."
  }
];

/* ========================================================= */

let order = [], idx = 0, right = 0, answers = [], wrongIds = [];
const $ = id => document.getElementById(id);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showStart() {
  $("start").classList.remove("hidden");
  $("quiz").classList.add("hidden");
  $("result").classList.add("hidden");
  $("retryBtn").classList.toggle("hidden", wrongIds.length === 0);
}

function startQuiz(onlyWrong) {
  let ids = onlyWrong ? wrongIds.slice() : QUESTIONS.map((_, i) => i);
  if ($("shuffleQ").checked) ids = shuffle(ids);
  order = ids; idx = 0; right = 0; answers = [];
  $("start").classList.add("hidden");
  $("result").classList.add("hidden");
  $("quiz").classList.remove("hidden");
  render();
}

function render() {
  const q = QUESTIONS[order[idx]];
  $("counter").textContent = `Вопрос ${idx + 1} из ${order.length}`;
  $("live").textContent = `Верно: ${right}`;
  $("bar").style.width = (idx / order.length * 100) + "%";
  $("qText").textContent = q.q;
  $("explain").classList.add("hidden");
  $("nextBtn").classList.add("hidden");

  let opts = q.options.map((t, i) => ({ t, i }));
  if ($("shuffleA").checked) opts = shuffle(opts);

  const box = $("options");
  box.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = o.t;
    b.dataset.i = o.i;
    b.onclick = () => choose(o.i);
    box.appendChild(b);
  });
}

function choose(i) {
  const qi = order[idx], q = QUESTIONS[qi], ok = i === q.correct;
  if (ok) right++;
  answers.push({ qi, chosen: i, ok });
  document.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    const bi = +b.dataset.i;
    if (bi === q.correct) b.classList.add("correct");
    else if (bi === i) b.classList.add("wrong");
  });
  $("live").textContent = `Верно: ${right}`;
  if (q.explain) {
    $("explain").innerHTML = "<b>" + (ok ? "✓ Верно. " : "✗ Неверно. ") + "Почему так:</b>";
    $("explain").appendChild(document.createTextNode(q.explain));
    $("explain").classList.remove("hidden");
  }
  $("nextBtn").textContent = idx === order.length - 1 ? "Показать результат" : "Далее";
  $("nextBtn").classList.remove("hidden");
}

function next() {
  idx++;
  if (idx < order.length) render(); else finish();
}

function finish() {
  $("quiz").classList.add("hidden");
  $("result").classList.remove("hidden");
  const pct = Math.round(right / order.length * 100);
  $("score").textContent = pct + "%";
  $("verdict").textContent = `${right} из ${order.length} верно — ` +
    (pct >= 90 ? "отлично!" : pct >= 70 ? "хорошо, но есть что повторить" : "нужно ещё потренироваться");

  wrongIds = answers.filter(a => !a.ok).map(a => a.qi);
  $("retryBtn2").classList.toggle("hidden", wrongIds.length === 0);

  const rv = $("review");
  rv.innerHTML = wrongIds.length ? "<h3 style='margin:0 0 6px'>Ошибки</h3>" : "";
  answers.filter(a => !a.ok).forEach(a => {
    const q = QUESTIONS[a.qi];
    const d = document.createElement("div");
    d.className = "review-item";
    d.innerHTML = `<b></b><div class="r-bad"></div><div class="r-ok"></div><div class="r-exp"></div>`;
    d.children[0].textContent = q.q;
    d.children[1].textContent = "Ваш ответ: " + q.options[a.chosen];
    d.children[2].textContent = "Правильно: " + q.options[q.correct];
    d.children[3].textContent = q.explain ? "Пояснение: " + q.explain : "";
    rv.appendChild(d);
  });
}

$("total").textContent = QUESTIONS.length;
showStart();
</script>
</body>
</html>
